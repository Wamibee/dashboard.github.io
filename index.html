<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="/favicon.ico">
  <title>Dashboard</title>
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<noscript>
  <strong>Need JavaScript...</strong>
</noscript>
<div id="app">
  <div class="blocs-container">
      <div class="bloc">
        <iframe
          width="600"
          height="100%"
          style="border: none; overflow: hidden;"
          frameborder="0"
          src="https://docs.google.com/document/d/1F2wgxwFQME8UaSe93q9zvx5wqhIEQM9cxBvc3y5nYX4/edit?rm=minimal"></iframe>
      </div>
      <div class="bloc randomWallpaper h-350">
        <img id="randomWallpaper" src="" alt=""/>
      </div>
      <div class="bloc playlist h-350">
        <iframe
          width="600"
          height="400"
          src="https://www.youtube.com/embed/videoseries?si=fJEYi6eV9xTwn2rC&amp;list=PL95B0mdarzLNzkMlD6meRFURV2PbnplBj"
          border="none">
        </iframe>
      </div>
  </div>
</div>
<script>
    let fileDate = new Date();
    const day = fileDate.getDate();
    let img = document.getElementById("randomWallpaper");
    img.src = "./wallpapers/" + day + ".jpg";
</script>
</body>
</html>
